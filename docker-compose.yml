


services:
  # ─── Frontend ─────────────────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:3000
        - NEXT_PUBLIC_WS_URL=ws://localhost:3000
    image: aegis-web:latest
    ports:
      - "3001:3001"
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3001
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      - NEXT_PUBLIC_WS_URL=ws://localhost:3000
    depends_on:
      - api
    restart: unless-stopped
    # No volume mounts for production builds - they override the built files
    # volumes:
    #   - ./apps/web:/app
    #   - /app/node_modules
    #   - /app/.next

  # ─── API Gateway (Node.js + Fastify) ──────────────────────────────────────
  api:
    image: aegis-api:latest
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/aegis
      - REDIS_URL=redis://redis:6379
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - AGENT_ORCHESTRATOR_URL=http://agent-orchestrator:8001
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OLLAMA_API_URL=http://ollama:11434/v1/chat/completions
      - OLLAMA_MODEL=qwen2:0.5b
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    restart: unless-stopped

  # ─── Agent Orchestrator (Python + FastAPI) ────────────────────────────────
  agent-orchestrator:
    image: aegis-agent-orchestrator:latest
    build:
      context: ./services/agent-orchestrator
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - ./services/agent-orchestrator/.env
    environment:
      - PYTHON_ENV=development
      - REDIS_URL=redis://redis:6379
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/aegis
      - OLLAMA_API_URL=http://ollama:11434/v1/chat/completions
      - OLLAMA_MODEL=qwen2:0.5b
      - API_URL=http://api:3000
      - SCRAPING_CONCURRENCY=3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - ./services/agent-orchestrator:/app
    restart: unless-stopped

  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=aegis
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Neo4j ────────────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Ollama (Local LLM) ────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["ollama", "serve"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0

  # ─── Go Gateway ───────────────────────────────────────────────────────────
  go-gateway:
    image: aegis-go-gateway:latest
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      - GATEWAY_PORT=8080
      - API_URL=http://api:3000
      - ORCHESTRATOR_URL=http://agent-orchestrator:8001
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ./services/go-gateway:/app

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  ollama_data:
