apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-gateway
  namespace: aegis
  labels:
    app: go-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-gateway
  template:
    metadata:
      labels:
        app: go-gateway
    spec:
      containers:
      - name: gateway
        image: aegis-go-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: GATEWAY_PORT
          value: "8080"
        - name: API_URL
          value: "http://api:3000"
        - name: ORCHESTRATOR_URL
          value: "http://agent-orchestrator:8001"
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: aegis-secrets
              key: OPENAI_API_KEY
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: aegis-secrets
              key: GEMINI_API_KEY
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: go-gateway
  namespace: aegis
  labels:
    app: go-gateway
spec:
  type: LoadBalancer
  selector:
    app: go-gateway
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
