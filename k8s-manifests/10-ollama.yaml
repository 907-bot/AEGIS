apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: aegis
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
        - |
          ollama serve &
          until ollama list >/dev/null 2>&1; do sleep 1; done
          ollama pull ${OLLAMA_MODEL:-qwen2:0.5b}
          wait
        ports:
        - containerPort: 11434
          name: api
        envFrom:
        - secretRef:
            name: aegis-secrets
        volumeMounts:
        - name: ollama-storage
          mountPath: /root/.ollama
        livenessProbe:
          exec:
            command:
            - ollama
            - list
          initialDelaySeconds: 30
          periodSeconds: 20
        readinessProbe:
          exec:
            command:
            - ollama
            - list
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: ollama-storage
        persistentVolumeClaim:
          claimName: ollama-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: aegis
spec:
  selector:
    app: ollama
  ports:
  - port: 11434
    targetPort: 11434
    name: api
  type: ClusterIP
