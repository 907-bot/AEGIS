apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: aegis
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: aegis-web:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3001"
        - name: NEXT_PUBLIC_API_URL
          value: "http://api:3008"
        - name: NEXT_PUBLIC_WS_URL
          value: "ws://api:3008"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: aegis
  labels:
    app: web
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
  - port: 3007
    targetPort: 3001
    protocol: TCP
    name: http
