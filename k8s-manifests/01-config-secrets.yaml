apiVersion: v1
kind: ConfigMap
metadata:
  name: aegis-config
  namespace: aegis
data:
  NODE_ENV: "production"
  PORT: "3000"
  REDIS_URL: "redis://redis:6379"
  NEO4J_URL: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_API_URL: "http://api:3008"
  NEXT_PUBLIC_WS_URL: "ws://api:3008"
  DB_SSL: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: aegis-secrets
  namespace: aegis
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/aegis"
  NEO4J_PASSWORD: "password"
  AGENT_ORCHESTRATOR_URL: "http://agent-orchestrator:8001"
  OPENAI_API_KEY: ""
  GEMINI_API_KEY: ""
  OLLAMA_API_URL: "http://ollama:11434/v1/chat/completions"
  OLLAMA_MODEL: "phi3:mini"
